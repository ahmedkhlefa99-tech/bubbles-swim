<style>
:root{
  --deep:#0a4d68; --sea:#088395; --aqua:#18b6d6; --foam:#eaf9fc; --sun:#ffc93c; --coral:#ff7a59;
  --ink:#10303c; --muted:#5f7b86; --line:#d3e9ef; --ok:#169b62; --warn:#c77700; --bad:#d04040; --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--foam);color:var(--ink);font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(165deg,var(--deep),var(--sea) 60%,var(--aqua));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 0 38px;position:relative;overflow:hidden}
header.top .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1;padding-right:44px}
header.top .logo{width:58px;height:58px;flex:0 0 58px}
header.top h1{margin:0;font-size:21px;font-weight:800;line-height:1.1;letter-spacing:.2px}
header.top p{margin:2px 0 0;opacity:.9;font-size:14px}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.25);animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}15%{opacity:1}to{transform:translateY(-140px);opacity:0}}
header.top svg.waves{position:absolute;bottom:-1px;left:0;width:100%;height:30px}
.badge-mode{display:inline-block;margin-top:8px;font-size:12px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:99px;position:relative;z-index:1}
.ig{display:inline-flex;align-items:center;gap:6px;margin-top:8px;margin-inline-start:6px;font-size:13px;color:#fff;text-decoration:none;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:99px;position:relative;z-index:1}
.card{background:#fff;border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(10,77,104,.07)}
.card h2{margin:0 0 10px;font-size:19px;color:var(--deep)}
.card h3{margin:14px 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-size:15px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--aqua);box-shadow:0 0 0 3px rgba(24,182,214,.15)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--sea);color:#fff;text-decoration:none;font-size:16px}
.btn.block{width:100%}
.btn.sun{background:var(--sun);color:var(--deep)}
.btn.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #f3caca}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink)}
.chip.on{border-color:var(--sea);background:var(--sea);color:#fff}
.pkg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg .chip{text-align:left;padding:12px}
.pkg .chip b{display:block;font-size:16px}.pkg .chip span{font-size:13px;opacity:.85}
.day{margin:12px 0 4px;font-weight:700;color:var(--deep)}
.slot{min-width:92px;text-align:center}
.slot small{display:block;font-weight:400;font-size:12px;opacity:.8}
.slot.full{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.steps{display:flex;gap:6px;margin:0 0 6px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--aqua),var(--sun))}
.sum{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum:last-child{border:0}
.total{font-size:23px;font-weight:800;color:var(--deep)}
.pay{background:#fff8e6;border:1.5px dashed #f1d38a;border-radius:16px;padding:14px;margin-top:12px}
.ipa{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700;direction:ltr}
.status{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.s-pending{background:#fff1dc;color:var(--warn)}.s-paid{background:#dcf5ea;color:var(--ok)}
.s-cancelled{background:#fbe3e3;color:var(--bad)}.s-done{background:#e6eef1;color:var(--muted)}
.bk{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.bk .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bk .hd b{font-size:17px}
.kv{font-size:14px;margin:3px 0}.kv span{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font-size:21px;color:var(--deep)}.stat span{font-size:13px;color:var(--muted)}
.tabsbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
.tabsbar .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;border:0;background:none;padding:6px 2px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--sea)}
.seg{display:flex;background:#eef6f8;border-radius:14px;padding:4px;gap:4px;margin-bottom:8px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--sea);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sched-slot{border-left:4px solid var(--aqua);background:#f5fbfd;border-radius:12px;padding:8px 10px;margin:6px 0}
.sched-slot .t{font-weight:700}
.pill{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:13px;margin:3px 0 0 4px}
.pill.nocoach{border-color:#f0c37a;background:#fff7e8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--deep);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:18px 6px}
.note{font-size:14px;background:#eef8fb;border-radius:12px;padding:10px;color:var(--deep);margin-top:10px}
.note.warn{background:#fff7e8;color:#7a4a00}
.hide{display:none!important}
.done-box{text-align:center;padding:10px 0}
.done-box .big{font-size:48px}
.tbl-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.tbl-row input,.tbl-row select{padding:8px}
.x{border:0;background:#fbe3e3;color:var(--bad);border-radius:10px;width:34px;height:34px;cursor:pointer;flex:0 0 34px;font-size:18px}
.hero{display:flex;gap:12px;align-items:center}
.intro h2{font-size:22px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tile{background:var(--foam);border-radius:14px;padding:10px 6px;text-align:center;font-weight:700;font-size:14px}
.tile span{display:block;font-size:26px;line-height:1.2}
.facts{list-style:none;padding:0;margin:8px 0}.facts li{padding:4px 0;font-size:15px}.facts li b{color:var(--deep)}
.how{display:grid;gap:8px;margin-top:10px}
.how div{display:flex;gap:10px;align-items:center;font-size:15px}
.how i{font-style:normal;flex:0 0 28px;height:28px;border-radius:14px;background:var(--sun);color:var(--deep);font-weight:800;display:flex;align-items:center;justify-content:center}
.wa{background:#169b62;font-size:18px;padding:16px}
.rcpt{display:block;max-width:160px;max-height:220px;border-radius:10px;margin-top:8px;border:1px solid var(--line);cursor:zoom-in;object-fit:cover}
.rcpt.big{max-width:100%;max-height:none;cursor:zoom-out}
.step-note{background:#fff8e6;border:1.5px dashed #f1d38a;border-radius:14px;padding:12px;margin:12px 0;font-size:15px}
.hero .t{flex:1}
.hero h2{margin:0}
.pkedit{border:1px solid #d6eef5;border-radius:14px;padding:4px 12px 12px;margin-top:10px}
.locs{background:#e8f6fb;border-radius:12px;padding:10px 12px;margin:12px 0 4px;font-size:15px;text-align:center}

/* ---- bubbles & motion ---- */
.hbubs{position:absolute;inset:0;pointer-events:none;z-index:0}
.bub{position:absolute;bottom:-30px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.28) 10% 38%,rgba(255,255,255,.08) 60%);border:1.5px solid rgba(255,255,255,.55);box-shadow:inset -2px -3px 6px rgba(255,255,255,.25);animation:rise var(--d,8s) ease-in infinite;animation-delay:var(--dl,0s);opacity:0}
.bub::after{content:"";position:absolute;inset:0;border-radius:50%;animation:sway var(--sw,3s) ease-in-out infinite alternate}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1}50%{transform:translate(var(--x,12px),-90px) scale(1)}90%{opacity:.9}100%{transform:translate(calc(var(--x,12px)*-1),-190px) scale(1.1);opacity:0}}
.sea-bubs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sea-bubs .bub{border-color:rgba(18,140,180,.28);background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 10%,rgba(120,210,235,.22) 11% 45%,rgba(120,210,235,.06) 70%);animation-name:riseFar}
@keyframes riseFar{0%{transform:translate(0,0);opacity:0}8%{opacity:.8}50%{transform:translate(var(--x,20px),-55vh)}92%{opacity:.6}100%{transform:translate(calc(var(--x,20px)*-1),-110vh);opacity:0}}
main.wrap{position:relative;z-index:1}
.wavebox{position:absolute;left:0;right:0;bottom:-1px;height:30px;overflow:hidden}
.wv{position:absolute;bottom:0;left:0;width:200%;height:30px}
.wv1{animation:waveX 9s linear infinite;bottom:4px}.wv2{animation:waveX 14s linear infinite reverse}
@keyframes waveX{from{transform:translateX(0)}to{transform:translateX(-50%)}}
header.top .logo{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.intro .tile{animation:popIn .55s cubic-bezier(.3,1.6,.5,1) both}
.intro .tile:nth-child(2){animation-delay:.12s}.intro .tile:nth-child(3){animation-delay:.24s}
.intro .tile span{display:block;animation:floaty 2.6s ease-in-out infinite}
.intro .tile:nth-child(2) span{animation-delay:.4s}.intro .tile:nth-child(3) span{animation-delay:.8s}
@keyframes popIn{from{transform:scale(.4) translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.intro .facts li{animation:slideIn .5s ease-out both}
.intro .facts li:nth-child(1){animation-delay:.3s}.intro .facts li:nth-child(2){animation-delay:.4s}.intro .facts li:nth-child(3){animation-delay:.5s}.intro .facts li:nth-child(4){animation-delay:.6s}.intro .facts li:nth-child(5){animation-delay:.7s}
@keyframes slideIn{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
.intro h2 .bb{display:inline-block;animation:floaty 1.8s ease-in-out infinite}
.nw{white-space:nowrap}
.soon{display:inline-block;background:#ffc93c;color:#0b3954;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;vertical-align:2px;text-transform:uppercase;letter-spacing:.04em}
details.info{background:#f5fbfd;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
details.info summary{font-weight:700;cursor:pointer}details.info p{margin:8px 0 0;font-size:14px;line-height:1.55}
.daychips .chip.full{border-color:#e6a817}.daychips .chip.full.on{background:#e6a817;border-color:#e6a817}
.lowleft{color:#c0392b}
.seg.att button{flex:1;font-size:13px}.seg.att button.on.p{background:#1f9d63;color:#fff}.seg.att button.on.a{background:#c0392b;color:#fff}.seg.att button.on.x{background:#e6a817;color:#fff}
.daychips{display:flex;flex-wrap:wrap;gap:6px}.daychips .chip{padding:6px 10px;font-size:13px}
.trialban{display:block;margin:12px 0 4px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,#ffc93c,#ffb347);color:#0b3954;text-decoration:none;font-size:17px;box-shadow:0 6px 16px rgba(255,170,40,.35)}.trialban span{display:block;font-size:14px;font-weight:600;opacity:.85;margin-top:2px}
.igcard{display:flex;align-items:center;gap:12px;margin:14px 0 6px;padding:12px 14px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(45deg,#f9a825 0%,#e1306c 45%,#c13584 70%,#5851db 100%);box-shadow:0 6px 18px rgba(193,53,132,.3);animation:popIn .6s .15s cubic-bezier(.3,1.6,.5,1) both}
.igic{flex:0 0 44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.igtx{flex:1;display:flex;flex-direction:column;line-height:1.3}.igtx b{font-size:16px}.igtx span{font-size:12.5px;opacity:.92}
.igbtn{background:#fff;color:#c13584;font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;animation:pulseIg 2.2s ease-in-out infinite}
@keyframes pulseIg{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.ig{font-size:14px!important;font-weight:700;padding:5px 12px!important;background:linear-gradient(45deg,#f9a825,#e1306c,#c13584)!important}
.contact{background:#eafaf1;border-radius:12px;padding:10px 12px;margin:10px 0 4px;text-align:center;font-size:15px}
.cbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.cbtn{background:#169b62;color:#fff;text-decoration:none;font-weight:700;padding:7px 12px;border-radius:99px;font-size:15px}
.mapcard{display:flex;align-items:center;gap:12px;margin:10px 0 4px;padding:12px 14px;border-radius:16px;background:#fff;border:2px solid #ffc93c;text-decoration:none;color:#0b3954}
.mpin{font-size:26px}.mtx{flex:1;display:flex;flex-direction:column;line-height:1.3}.mtx b{font-size:15px}.mtx span{font-size:12.5px;color:#0e7c99}
.mgo{background:#0b3954;color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:99px}
.locs{animation:popIn .6s .2s cubic-bezier(.3,1.6,.5,1) both}
.pop{position:fixed;z-index:50;pointer-events:none;border-radius:50%;border:1.5px solid rgba(18,140,180,.55);background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(120,210,235,.3) 13% 60%,transparent 70%);animation:popUp .9s ease-out forwards}
@keyframes popUp{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.bub,.wv,.pop,header.top .logo,.intro *{animation:none!important}.bub,.pop{display:none}}
#musicBtn{position:absolute;top:calc(14px + env(safe-area-inset-top));right:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(4px)}
#musicBtn.on{animation:pulseM 2s ease-in-out infinite}
@keyframes pulseM{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
</style>
</head>
<body>
<div class="sea-bubs" id="seaBubs" aria-hidden="true"></div>
<header class="top">
  <div class="hbubs" id="hBubs" aria-hidden="true"></div>
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" style="border-radius:50%;background:#fff">
      <div><h1 id="appName">Bubbles Swim Academy</h1><p id="appLoc">Swimming for every age</p></div>
    </div>
    <span class="badge-mode" id="modeBadge">Loading…</span><a class="ig hide" id="igLink" target="_blank" rel="noopener">📷 Follow us on Instagram</a>
  </div>
  <div class="wavebox" aria-hidden="true">
    <svg class="wv wv1" viewBox="0 0 2400 40" preserveAspectRatio="none"><path d="M0,20 C150,40 450,0 600,20 C750,40 1050,0 1200,20 C1350,40 1650,0 1800,20 C1950,40 2250,0 2400,20 L2400,40 L0,40 Z" fill="rgba(255,255,255,.35)"/></svg>
    <svg class="wv wv2" viewBox="0 0 2400 40" preserveAspectRatio="none"><path d="M0,22 C200,6 400,38 600,22 C800,6 1000,38 1200,22 C1400,6 1600,38 1800,22 C2000,6 2200,38 2400,22 L2400,40 L0,40 Z" fill="#eaf9fc"/></svg>
  </div>
</header>

<main class="wrap">
  <section id="v-book"></section>
  <section id="v-mine" class="hide"></section>
  <section id="v-pay" class="hide"></section>
  <section id="v-renew" class="hide"></section>
  <section id="v-login" class="hide"></section>
  <section id="v-admin" class="hide"></section>
  <section id="v-report" class="hide"></section>
  <section id="v-att" class="hide"></section>
  <section id="v-sched" class="hide"></section>
  <section id="v-settings" class="hide"></section>
</main>

<p class="foot" style="text-align:center;color:#8aa3ad;font-size:12px;margin:18px 0 8px">© Bubbles Swim Academy</p>
<nav class="tabsbar"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>

<script>
// ---- bubbles ----
(function(){const R=(a,b)=>a+Math.random()*(b-a);
  const mk=(box,n,big,dur)=>{if(!box)return;for(let i=0;i<n;i++){const e=document.createElement("span"),z=R(...big);e.className="bub";e.style.cssText=`width:${z}px;height:${z}px;left:${R(0,97)}%;--d:${R(...dur)}s;--dl:${R(0,dur[1])}s;--x:${R(-22,22)}px`;box.appendChild(e)}};
  mk(document.getElementById("hBubs"),28,[8,34],[4.5,9]);
  mk(document.getElementById("seaBubs"),14,[8,30],[14,26]);
  document.addEventListener("pointerdown",e=>{if(!e.target.closest("#v-book,header.top"))return;if(e.target.closest("input,select,textarea"))return;
    for(let i=0;i<7;i++){const b=document.createElement("span"),z=R(6,16);b.className="pop";b.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-z/2}px;top:${e.clientY-z/2}px;--x:${R(-40,40)}px;--y:${R(-90,-35)}px;animation-delay:${i*25}ms`;document.body.appendChild(b);setTimeout(()=>b.remove(),1200)}},{passive:true})})();
</script>
<script>
// ---- soft background music (generated live, no files) ----
(function(){let ctx,master,on=false,timer,step=0;
  const btn=document.createElement("button");btn.id="musicBtn";btn.type="button";btn.setAttribute("aria-label","Music on/off");
  const pref=()=>{try{return localStorage.getItem("bubbles_music")}catch(e){return null}},setPref=v=>{try{localStorage.setItem("bubbles_music",v)}catch(e){}};
  const paint=()=>{btn.textContent=on?"🔊":"🔈";btn.classList.toggle("on",on)};paint();
  document.addEventListener("DOMContentLoaded",()=>document.querySelector("header.top").appendChild(btn));
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function tone(m,t,dur,vol,type="sine",att=.02){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz(m);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
  function bloop(t){const o=ctx.createOscillator(),g=ctx.createGain(),f=400+Math.random()*500;o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.6,t+.12);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
  // calm progression: Fmaj7 – Am7 – Dm7 – Cmaj7 (soft & warm)
  const CH=[[53,57,60,64],[57,60,64,67],[50,53,57,60],[48,52,55,59]],SC=[72,74,76,79,81,84,77];
  function bar(){const t=ctx.currentTime+.05,c=CH[step%4];
    c.forEach((m,i)=>tone(m,t+i*.04,4.6,.035,"triangle",1.2));tone(c[0]-12,t,4.4,.05,"sine",.6);
    for(let i=0;i<4;i++)if(Math.random()<.7)tone(SC[Math.floor(Math.random()*SC.length)],t+i*1+Math.random()*.15,1.6,.04,"sine",.01);
    if(Math.random()<.6)bloop(t+Math.random()*4);if(Math.random()<.4)bloop(t+Math.random()*4);step++}
  function start(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();
      const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;
      const dl=ctx.createDelay();dl.delayTime.value=.33;const fb=ctx.createGain();fb.gain.value=.32;
      master.connect(lp);lp.connect(ctx.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ctx.destination)}

    on=true;paint();if(!timer){bar();timer=setInterval(bar,4000)}}
  function stop(){on=false;paint();if(!ctx)return;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.6);
    clearInterval(timer);timer=null}
  btn.addEventListener("click",e=>{e.stopPropagation();if(on){stop();setPref("off")}else{start();setPref("on")}});
  // browsers only allow sound after the first tap: start then, unless the visitor turned it off before
  const first=e=>{if(e.target===btn)return;document.removeEventListener("pointerdown",first,true);
    if(pref()==="off"||/admin/.test(location.hash))return;start()};
  document.addEventListener("pointerdown",first,true);
  document.addEventListener("visibilitychange",()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(on)ctx.resume()});
})();

const payHash=()=>{const m=location.hash.match(/^#pay-([A-Za-z0-9]{6,40})$/);return m?m[1]:null};

function render(){
  const st=S.settings;
  $("appName").textContent=st.name||"Bubbles Swim Academy";$("appLoc").textContent="Swimming for every age";
  $("modeBadge").textContent=S.mode==="loading"?"Loading…":S.mode==="demo"?"Demo — not connected to the database":S.admin?"Signed in as coach ✔":"Book your class in 2 minutes 🫧";
  const ig=$("igLink");const h=igHandle();
  if(h){ig.href="https://instagram.com/"+encodeURIComponent(h);ig.classList.remove("hide")}else ig.classList.add("hide");
  const tabs=[["book","Book"],["mine","My bookings"]];
  if(S.admin)tabs.push(["admin","Bookings"],["att","Attendance"],["sched","Schedule"],["settings","Settings"]);
  else if(wantsAdmin()||S.tab==="login")tabs.push(["login","Coach login"]);

  if(!tabs.find(t=>t[0]===S.tab)&&S.tab!=="pay"&&S.tab!=="renew"&&!(S.tab==="report"&&S.admin))S.tab="book";
  $("tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab ${S.tab===k?"on":""}" data-tab="${k}">${ICONS[k]}${l}</button>`).join("");
  for(const k of ["book","mine","pay","renew","login","admin","report","att","sched","settings"])$("v-"+k).classList.toggle("hide",S.tab!==k);
  ({book:renderBook,mine:renderMine,pay:renderPay,renew:renderRenew,login:renderLogin,admin:renderAdmin,report:renderReport,att:renderAtt,sched:renderSched,settings:renderSettings})[S.tab]();
}

function bookingMsg(b){
  const L=[`New ${b.preferredTimes?"booking request":"booking"} - ${S.settings.name}`,`Swimmer: ${b.childName} (${b.age}) — ${b.level}`,...(b.child2Name?[`Second swimmer: ${b.child2Name} (${b.child2Age})`]:[]),...((b.siblings||[]).length?[`Siblings: ${b.siblings.join(", ")}`]:[]),`Parent: ${b.parentName} — ${b.phone}`,...(b.location?[`Location: ${b.location}`]:[]),`Package: ${b.package} — ${b.sessionType||"Private"} (${b.ptype==="trial"?"FREE":b.amount+" EGP"}${b.ptype==="group"?" per swimmer":b.ptype==="sib"?" for all siblings":""})`];
  if(b.preferredTimes)L.push(`Times a week: ${b.ptype==="trial"?"trial class":b.perWeek||2}`,`Requested times: ${b.preferredTimes}`);else L.push(`Times: ${(b.slots||[]).map(slotLabel).join(", ")}`);

// shrink a screenshot so it fits comfortably in one database document (well under 1 MB)
function shrinkImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  let w=img.width,h=img.height;const max=1100;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
  let q=0.7,out=c.toDataURL("image/jpeg",q);while(out.length>600000&&q>0.3){q-=0.1;out=c.toDataURL("image/jpeg",q)}res(out)};img.src=r.result};r.readAsDataURL(file)})}
async function reportPayment(b,payer,ref,receipt){

  if(S.mode==="demo"){S.payments.push({id:rid(),...doc});return}
  await S.F.setDoc(S.F.doc(S.F.collection(S.fs,"bookings")),doc);
}

function reportData(month){

  const noLoc=active.filter(b=>!LOCATIONS.includes(locNorm(b.location)));if(noLoc.length)locs.push({l:"Not set",swimmers:noLoc.reduce((x,b)=>x+swimmersOf(b),0),bookings:noLoc.length,rev:paid.filter(b=>!LOCATIONS.includes(locNorm(b.location))).reduce((x,b)=>x+Number(b.amount||0),0)});
  const pk={};for(const b of paid){pk[b.package]=pk[b.package]||{n:0,sum:0};pk[b.package].n++;pk[b.package].sum+=Number(b.amount||0)}
  let pres=0,abs=0,exc=0;for(const b of B)for(const [d,v] of Object.entries(b.att||{}))if(d.startsWith(month)){v==="p"?pres++:v==="a"?abs++:exc++}

}

      ${F==="wait"?(S.waitlist.length?[...S.waitlist].sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")).map((w,i)=>`<div class="bk"><div class="hd"><b>${i+1}. ${esc(w.childName)} <span class="muted">(${esc(w.age)})</span></b><span class="status s-pending">Waiting</span></div>
        <div class="kv"><span>Location:</span> <b>📍 ${esc(w.location)}</b> • ${esc(w.want||"")}</div>
        <div class="kv"><span>Times:</span> ${esc(w.preferredTimes||"-")}</div>
        <div class="kv"><span>Parent:</span> ${esc(w.parentName)} • <a href="https://wa.me/${waNum(w.phone)}" target="_blank" rel="noopener" dir="ltr">${esc(w.phone)}</a> • ${esc(w.level)}</div>
        <div class="kv"><span>Joined:</span> ${w.createdAt?fmtDate(new Date(w.createdAt)):"-"}</div>
        <div class="actions"><a class="btn sm ok" href="https://wa.me/${waNum(w.phone)}?text=${encodeURIComponent(`Hi ${w.parentName}\nGood news! A place has opened at ${S.settings.name} in ${w.location} for ${w.childName}.\nBook here:\nhttps://${location.host}/`)}" target="_blank" rel="noopener">📲 A place is free — tell them</a><button class="btn sm bad" data-delw="${w.id}">Remove</button></div></div>`).join(""):`<div class="empty">Nobody on the waiting list.</div>`)
      :list.length?list.map(b=>card(b,true)).join(""):`<div class="empty">No bookings here.</div>`}
      <div class="note">Before “Confirm payment”, check your bank app that the reference and amount actually arrived.</div></div>
    <div class="actions"><button class="btn ghost block" data-act="logout">Sign out</button></div>`;
}
$("v-admin").addEventListener("click",async e=>{
  if(e.target.classList?.contains("rcpt")){e.target.classList.toggle("big");return}
  {const r=e.target.closest("[data-rcpt]");if(r){r.disabled=true;r.textContent="Loading…";let src=S.archive[r.dataset.rcpt];
    if(!src&&S.mode==="live"){try{const d=await S.F.getDoc(S.F.doc(S.fs,"bookings",r.dataset.rcpt));src=d.exists()?d.data().receipt:""}catch(err){console.error(err)}}
    if(src){const img=document.createElement("img");img.src=src;img.className="rcpt big";img.alt="Transfer screenshot";r.replaceWith(img)}else{r.textContent="Screenshot not found";}return}}
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.confirmreq){const b=S.bookings.find(x=>x.id===t.dataset.confirmreq);if(!b)return;t.disabled=true;
    const ids=[];for(const r of (b.reqSlots||[])){const sid="s"+r.day+String(r.time).replace(":","");ids.push(sid);if(!slotById(sid)){if(!await safe(()=>saveSlot({id:sid,day:r.day,time:r.time,active:true})))return}}
    await safe(()=>updateBooking(b.id,{slots:ids,coachBySlot:{...(b.coachBySlot||{}),...autoAssign(ids,b.coachPref,b.ptype,b.id)}}),"Times confirmed ✔ — now send the payment link");return}
  if(t.dataset.confirmtime){const b=S.bookings.find(x=>x.id===t.dataset.confirmtime);if(!b)return;
    const day=+$("cd-"+b.id).value,time=$("ct-"+b.id).value;if(!time)return toast("Choose a time");
    const sid="s"+day+time.replace(":","");if((b.slots||[]).includes(sid))return toast("Already added");
    t.disabled=true;
    if(!slotById(sid)){if(!await safe(()=>saveSlot({id:sid,day,time,active:true})))return;}
    await safe(()=>updateBooking(b.id,{slots:[...(b.slots||[]),sid],coachBySlot:{...(b.coachBySlot||{}),...autoAssign([sid],b.coachPref,b.ptype,b.id)}}),"Time added ✔");return}
  if(t.dataset.f){S.adminFilter=t.dataset.f;return renderAdmin()}
  if(t.dataset.act==="openReport"){S.tab="report";render();scrollTo(0,0);return}
  if(t.dataset.delw){if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Sure? Tap again";return}
    if(S.mode==="demo"){S.waitlist=S.waitlist.filter(x=>x.id!==t.dataset.delw);return renderAdmin()}await safe(()=>S.F.deleteDoc(S.F.doc(S.fs,"bookings",t.dataset.delw)),"Removed");return}
  if(t.dataset.act==="logout"){if(S.mode==="live")await S.A.signOut(S.auth);S.tab="book";location.hash="";return render()}
  if(t.dataset.st){const b=S.bookings.find(x=>x.id===t.dataset.id);if(!b)return;const st=t.dataset.st,upd={status:st};
    const reps=S.payments.filter(x=>x.bookingId===b.id);
    if(st==="paid"){upd.paidAt=new Date().toISOString();if(!b.ref&&reps.length){upd.payer=reps.at(-1).payer;upd.ref=reps.at(-1).ref;if(reps.at(-1).receipt)upd.receiptId=reps.at(-1).id}const miss=(b.slots||[]).filter(s=>!cOf((b.coachBySlot||{})[s]));if(miss.length)upd.coachBySlot={...(b.coachBySlot||{}),...autoAssign(miss,b.coachPref,b.ptype,b.id)}}
    t.disabled=true;const ok=await safe(()=>updateBooking(b.id,upd),st==="paid"?"Confirmed ✔ — send the parent a WhatsApp message":"Updated");
    if(ok&&st==="paid"&&b.renewOf){const old=S.bookings.find(x=>x.id===b.renewOf);if(old&&old.status==="paid")await safe(()=>updateBooking(old.id,{status:"done"}))}
    if(ok&&st==="paid")for(const r of reps){const keep=r.id===upd.receiptId; // the screenshot is archived (not loaded with the list), the rest deleted
      if(S.mode==="demo"){if(keep)S.archive[r.id]=r.receipt;S.payments=S.payments.filter(x=>x.id!==r.id)}
      else{try{keep?await S.F.updateDoc(S.F.doc(S.fs,"bookings",r.id),{status:"archived"}):await S.F.deleteDoc(S.F.doc(S.fs,"bookings",r.id))}catch(_){}}}
    if(S.mode==="demo")render();return}
  if(t.dataset.del){if(t.dataset.sure)await safe(()=>deleteBooking(t.dataset.del),"Deleted");else{t.dataset.sure="1";t.textContent="Sure? Tap again"}}
});
$("v-settings").addEventListener("click",e=>{const t=e.target.closest("[data-ld],[data-full],[data-soon]");if(t)t.classList.toggle("on")});
$("v-settings").addEventListener("change",e=>{if(e.target.id!=="st-pksel")return;S.pkSel=e.target.value;document.querySelectorAll("#st-pkgs [data-p]").forEach(r=>r.style.display=r.dataset.p===S.pkSel?"":"none")});
$("v-settings").addEventListener("input",e=>{const r=e.target.closest("#st-pkgs [data-p]");if(!r)return;const o=$("st-pksel")?.querySelector(`option[value="${r.dataset.p}"]`);if(o)o.textContent=`${r.querySelector("[data-k=label]").value.trim()||"New package"} — ${+r.querySelector("[data-k=price]").value||0} EGP`});
$("v-admin").addEventListener("change",async e=>{
  const as=e.target.closest("[data-addslot]");
  if(as&&as.value){const b=S.bookings.find(x=>x.id===as.dataset.addslot);if(!b)return;const sid=as.value;
    if(!b.start&&false)return;
    await safe(()=>updateBooking(b.id,{slots:[...(b.slots||[]),sid],coachBySlot:{...(b.coachBySlot||{}),...autoAssign([sid],b.coachPref,b.ptype,b.id)}}),"Slot added ✔");return}
  const s=e.target.closest("[data-coach]");if(!s)return;const b=S.bookings.find(x=>x.id===s.dataset.coach);if(!b)return;
  await safe(()=>updateBooking(b.id,{coachBySlot:{...(b.coachBySlot||{}),[s.dataset.s]:gpre(b.ptype)+s.value}}),"Coach assigned")});

/* ---------- admin: schedule ---------- */
function renderSched(){
  const act=S.slots.filter(s=>s.active!==false).sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time)),byDay={};act.forEach(s=>(byDay[s.day]=byDay[s.day]||[]).push(s));
  $("v-sched").innerHTML=`<div class="card"><h2>Weekly schedule</h2>
    <div class="seg"><button class="${S.schedCoach==="all"?"on":""}" data-sc="all">All</button>${S.settings.coaches.map(c=>`<button class="${S.schedCoach===c.id?"on":""}" data-sc="${c.id}">${esc(c.name)}</button>`).join("")}</div>
    ${Object.keys(byDay).map(d=>`<div class="day">${DAYS[d]}</div>${byDay[d].map(s=>{
      let kids=S.bookings.filter(b=>isActive(b)&&(b.slots||[]).includes(s.id));if(S.schedCoach!=="all")kids=kids.filter(b=>cOf((b.coachBySlot||{})[s.id])===S.schedCoach);
      return `<div class="sched-slot"><div class="t">${fmtTime(s.time)} <span class="muted">• ${slotUse(s.id)}/${slotCap()}</span></div>${kids.length?kids.map(b=>{const c=coachById(cOf((b.coachBySlot||{})[s.id]));return `<span class="pill ${c?"":"nocoach"}">${esc(b.childName)} ← ${esc(c?.name||"no coach")}${b.status==="pending"?" ⏳":""}</span>`}).join(""):`<span class="muted">Empty</span>`}</div>`}).join("")}`).join("")||`<div class="empty">No slots. Add them in Settings.</div>`}
    <p class="muted">⏳ = payment not confirmed yet.</p></div>`;
}
$("v-sched").addEventListener("click",e=>{const t=e.target.closest("[data-sc]");if(t){S.schedCoach=t.dataset.sc;renderSched()}});

/* ---------- admin: settings ---------- */
function renderSettings(){
  const el=$("v-settings");if(document.activeElement&&el.contains(document.activeElement))return;
  const st=S.settings,slots=[...S.slots].sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));
  el.innerHTML=`<div class="card"><h2>Basics</h2>
      <label>Academy name</label><input id="st-name" value="${esc(st.name)}">
      <input id="st-loc" type="hidden" value="${esc(st.location)}">
      <label>WhatsApp number (booking requests go here)</label><input id="st-phone" dir="ltr" value="${esc(st.phone)}" placeholder="01xxxxxxxxx">
      <label>Second WhatsApp number</label><input id="st-phone2" dir="ltr" value="${esc(st.phone2||"")}" placeholder="01xxxxxxxxx (optional)">
      <label>Instagram account</label><input id="st-ig" dir="ltr" value="${esc(st.instagram)}" placeholder="@bubbles.swim">
      <label>About the academy (shown to parents)</label><textarea id="st-about" rows="3">${esc(st.about)}</textarea>
      <div class="row"><div><label>Class length (minutes)</label><input id="st-min" type="number" value="${esc(st.sessionMinutes)}"></div>
      <div><label>Swimmers per coach per slot</label><input id="st-per" type="number" min="1" max="6" value="${esc(st.perCoach)}"></div></div></div>
    <div class="card"><h2>Locations & class days</h2><p class="muted">Tap the days each location has classes. Parents can only pick these days. None selected = every day.</p>
      ${LOCATIONS.map(l=>{const a=(st.locDays||{})[l]||[];return `<label>${esc(l)}</label><div class="chips daychips" data-loc="${esc(l)}">${DAYS.map((d,k)=>`<button type="button" class="chip ${a.includes(k)?"on":""}" data-ld="${k}">${d.slice(0,3)}</button>`).join("")}<button type="button" class="chip full ${isFull(l)?"on":""}" data-full="${esc(l)}">Full → waiting list</button><button type="button" class="chip full ${isSoon(l)?"on":""}" data-soon="${esc(l)}">Coming soon</button></div>
        <div class="row"><div><input data-lplace="${esc(l)}" value="${esc(((st.locInfo||{})[l]||{}).place||"")}" placeholder="Place name (e.g. club or school)"></div><div><input data-lmaps="${esc(l)}" dir="ltr" value="${esc(((st.locInfo||{})[l]||{}).maps||"")}" placeholder="Google Maps link"></div></div>`}).join("")}</div>
    <div class="card"><h2>Info for parents</h2>
      <label>What to bring</label><textarea id="st-bring" rows="2">${esc(st.bring)}</textarea>
      <label>Absence & make-up policy (one rule per line)</label><textarea id="st-policy" rows="4">${esc(st.policy)}</textarea></div>
    <div class="card"><h2>Payment (InstaPay)</h2>
      <label>InstaPay address (IPA)</label><input id="st-ipa" dir="ltr" placeholder="name@instapay" value="${esc(st.ipa)}">
      <label>InstaPay payment link (optional)</label><input id="st-link" dir="ltr" placeholder="https://ipn.eg/S/..." value="${esc(st.payLink)}"></div>
    <div class="card"><h2>Coaches</h2><div id="st-coaches">${st.coaches.map(c=>`<div class="tbl-row" data-c="${c.id}"><input value="${esc(c.name)}" data-k="name"><select data-k="gender" style="flex:0 0 95px"><option value="m" ${c.gender==="m"?"selected":""}>Coach (m)</option><option value="f" ${c.gender==="f"?"selected":""}>Coach (f)</option></select><button class="x" data-rmc="${c.id}">×</button></div>`).join("")}</div>
      <button class="btn sm ghost" data-act="addCoach">+ Coach</button></div>
    <div class="card"><h2>Packages & prices</h2><p class="muted">Choose a package to edit it. Prices in EGP.</p>${(()=>{if(!st.packages.some(p=>p.id===S.pkSel))S.pkSel=st.packages[0]?.id;return ""})()}
      <select id="st-pksel">${st.packages.map(p=>`<option value="${p.id}" ${p.id===S.pkSel?"selected":""}>${esc(p.label||"New package")} — ${p.price} EGP</option>`).join("")}</select>
      <div id="st-pkgs">${st.packages.map(p=>`<div class="pkedit" data-p="${p.id}" ${p.id===S.pkSel?"":'style="display:none"'}>
        <label>Type</label><select data-k="type">${Object.keys(TYPES).map(k=>`<option value="${k}" ${typeOfPkg(p)===k?"selected":""}>${TYPES[k].name}</option>`).join("")}</select>
        <label>Name parents see</label><input value="${esc(p.label)}" data-k="label" placeholder="e.g. Private · 8 sessions">
        <div class="row"><div><label>Sessions</label><input type="number" min="1" value="${p.sessions}" data-k="sessions"></div>
        <div><label>Price (EGP)</label><input type="number" min="0" value="${p.price}" data-k="price"></div></div>
        <div class="row"><div><label>Minutes</label><input type="number" value="${esc(p.minutes||"")}" data-k="minutes" placeholder="${st.sessionMinutes} (default)"></div>
        <div><label>Siblings #</label><input type="number" min="2" max="8" value="${esc(p.count||"")}" data-k="count" placeholder="siblings only"></div></div>
        <p class="muted" style="font-size:13px">Price is: private for 2 = total for both · groups = per swimmer · siblings = total for all.</p>
        <button class="btn sm ghost" style="color:#c0392b" data-rmp="${p.id}">🗑 Delete this package</button></div>`).join("")}</div>
      <button class="btn sm ghost" data-act="addPkg">+ Package</button></div>
    <div class="actions"><button class="btn block" data-act="saveSettings">Save settings</button></div>
    <div class="card"><h2>Bookable slots</h2>
      ${slots.map(s=>`<div class="tbl-row"><span style="flex:1">${DAYS[s.day]} ${fmtTime(s.time)} <span class="muted">(${slotUse(s.id)} booked)</span></span><button class="btn sm ${s.active!==false?"ghost":""}" data-tog="${s.id}">${s.active!==false?"Open":"Closed"}</button><button class="x" data-rms="${s.id}">×</button></div>`).join("")||`<div class="empty">No slots yet. <button class="btn sm sun" data-act="seedSlots">Add starter slots</button></div>`}
      <h3>Add a slot</h3><div class="row"><select id="ns-day">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select><input id="ns-time" type="time" value="17:00"></div>
      <div class="actions"><button class="btn block ghost" data-act="addSlot">+ Add slot</button></div></div>
    <div class="note">Coach login link: the academy link with <b>#admin</b> at the end</div>`;
}
function readSettings(){const st=structuredClone(S.settings),v=id=>$(id).value.trim();
  Object.assign(st,{name:v("st-name"),location:v("st-loc"),phone:v("st-phone"),phone2:v("st-phone2"),instagram:v("st-ig"),about:v("st-about"),ipa:v("st-ipa"),payLink:cleanLink(v("st-link")),sessionMinutes:+v("st-min")||45,perCoach:Math.max(1,+v("st-per")||1)});
  st.coaches=[...document.querySelectorAll("#st-coaches [data-c]")].map(r=>({id:r.dataset.c,name:r.querySelector("[data-k=name]").value.trim()||"Coach",gender:r.querySelector("[data-k=gender]").value}));
  st.packages=[...document.querySelectorAll("#st-pkgs [data-p]")].map(r=>({id:r.dataset.p,type:r.querySelector("[data-k=type]").value,count:Math.max(0,+r.querySelector("[data-k=count]").value||0),minutes:Math.max(0,+r.querySelector("[data-k=minutes]").value||0),label:r.querySelector("[data-k=label]").value.trim()||"Package",sessions:Math.max(1,+r.querySelector("[data-k=sessions]").value||1),price:Math.max(0,+r.querySelector("[data-k=price]").value||0)}));
  st.locDays={};document.querySelectorAll("#v-settings .daychips").forEach(r=>{st.locDays[r.dataset.loc]=[...r.querySelectorAll(".chip.on[data-ld]")].map(x=>+x.dataset.ld)});
  st.locFull=[...document.querySelectorAll("#v-settings [data-full].on")].map(x=>x.dataset.full);
  st.locSoon=[...document.querySelectorAll("#v-settings [data-soon].on")].map(x=>x.dataset.soon);
  st.locInfo={};document.querySelectorAll("#v-settings [data-lplace]").forEach(i=>{const l=i.dataset.lplace,m=document.querySelector(`#v-settings [data-lmaps="${l}"]`);const place=i.value.trim(),maps=cleanLink(m?m.value:"");if(place||maps)st.locInfo[l]={place,maps}});
  st.bring=v("st-bring");st.policy=v("st-policy");
  st.pkgVersion=8;st.locVersion=2;return st}
function reSettings(){document.activeElement?.blur?.();renderSettings()}
$("v-settings").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const a=t.dataset.act;
  if(a==="addCoach"){S.settings=readSettings();S.settings.coaches.push({id:"c"+rid().slice(0,6),name:"",gender:"m"});return reSettings()}
  if(a==="addPkg"){S.settings=readSettings();const nid="p"+rid().slice(0,6);S.settings.packages.push({id:nid,type:"p1",label:"",sessions:8,price:0});S.pkSel=nid;return reSettings()}
  if(t.dataset.rmc){S.settings=readSettings();if(S.settings.coaches.length<=1)return toast("Keep at least one coach");S.settings.coaches=S.settings.coaches.filter(c=>c.id!==t.dataset.rmc);reSettings();return toast("Press “Save” to keep this")}
  if(t.dataset.rmp){S.settings=readSettings();if(S.settings.packages.length<=1)return toast("Keep at least one package");S.settings.packages=S.settings.packages.filter(p=>p.id!==t.dataset.rmp);reSettings();return toast("Press “Save” to keep this")}
  if(a==="saveSettings"){const st=readSettings();t.disabled=true;if(await safe(()=>saveSettings(st),"Saved ✔"))S.settings=st;t.disabled=false;return reSettings()}
  if(a==="seedSlots"){t.disabled=true;for(const s of DEFAULT_SLOTS)await safe(()=>saveSlot(s));toast("Added ✔ — edit as you like");return reSettings()}
  if(a==="addSlot"){const day=+$("ns-day").value,time=$("ns-time").value;if(!time)return;const id="s"+day+time.replace(":","");
    if(slotById(id))return toast("That slot already exists");await safe(()=>saveSlot({id,day,time,active:true}),"Added ✔");return reSettings()}
  if(t.dataset.tog){const s=slotById(t.dataset.tog);await safe(()=>saveSlot({...s,active:s.active===false}));return reSettings()}
  if(t.dataset.rms){if(slotUse(t.dataset.rms)>0)return toast("This slot has bookings — close it instead of deleting");await safe(()=>deleteSlot(t.dataset.rms));return reSettings()}
});

render();init();
</script>
