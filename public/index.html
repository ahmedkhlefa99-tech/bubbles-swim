<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubbles Swim Academy — Book a swim class</title>

<style>
:root{
  --deep:#0a4d68; --sea:#088395; --aqua:#18b6d6; --foam:#eaf9fc; --sun:#ffc93c; --coral:#ff7a59;
  --ink:#10303c; --muted:#5f7b86; --line:#d3e9ef; --ok:#169b62; --warn:#c77700; --bad:#d04040; --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--foam);color:var(--ink);font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(165deg,var(--deep),var(--sea) 60%,var(--aqua));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 0 38px;position:relative;overflow:hidden}
header.top .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
header.top .logo{width:58px;height:58px;flex:0 0 58px}
header.top h1{margin:0;font-size:23px;font-weight:800;line-height:1.1;letter-spacing:.2px}
header.top p{margin:2px 0 0;opacity:.9;font-size:14px}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.25);animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}15%{opacity:1}to{transform:translateY(-140px);opacity:0}}
header.top svg.waves{position:absolute;bottom:-1px;left:0;width:100%;height:30px}
.badge-mode{display:inline-block;margin-top:8px;font-size:12px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:99px;position:relative;z-index:1}
.ig{display:inline-flex;align-items:center;gap:6px;margin-top:8px;margin-inline-start:6px;font-size:13px;color:#fff;text-decoration:none;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:99px;position:relative;z-index:1}
.card{background:#fff;border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(10,77,104,.07)}
.card h2{margin:0 0 10px;font-size:19px;color:var(--deep)}
.card h3{margin:14px 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-size:15px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--aqua);box-shadow:0 0 0 3px rgba(24,182,214,.15)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--sea);color:#fff;text-decoration:none;font-size:16px}
.btn.block{width:100%}
.btn.sun{background:var(--sun);color:var(--deep)}
.btn.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #f3caca}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink)}
.chip.on{border-color:var(--sea);background:var(--sea);color:#fff}
.pkg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg .chip{text-align:left;padding:12px}
.pkg .chip b{display:block;font-size:16px}.pkg .chip span{font-size:13px;opacity:.85}
.day{margin:12px 0 4px;font-weight:700;color:var(--deep)}
.slot{min-width:92px;text-align:center}
.slot small{display:block;font-weight:400;font-size:12px;opacity:.8}
.slot.full{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.steps{display:flex;gap:6px;margin:0 0 6px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--aqua),var(--sun))}
.sum{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum:last-child{border:0}
.total{font-size:23px;font-weight:800;color:var(--deep)}
.pay{background:#fff8e6;border:1.5px dashed #f1d38a;border-radius:16px;padding:14px;margin-top:12px}
.ipa{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700;direction:ltr}
.status{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.s-pending{background:#fff1dc;color:var(--warn)}.s-paid{background:#dcf5ea;color:var(--ok)}
.s-cancelled{background:#fbe3e3;color:var(--bad)}.s-done{background:#e6eef1;color:var(--muted)}
.bk{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.bk .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bk .hd b{font-size:17px}
.kv{font-size:14px;margin:3px 0}.kv span{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font-size:21px;color:var(--deep)}.stat span{font-size:13px;color:var(--muted)}
.tabsbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
.tabsbar .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;border:0;background:none;padding:6px 2px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--sea)}
.seg{display:flex;background:#eef6f8;border-radius:14px;padding:4px;gap:4px;margin-bottom:8px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--sea);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sched-slot{border-left:4px solid var(--aqua);background:#f5fbfd;border-radius:12px;padding:8px 10px;margin:6px 0}
.sched-slot .t{font-weight:700}
.pill{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:13px;margin:3px 0 0 4px}
.pill.nocoach{border-color:#f0c37a;background:#fff7e8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--deep);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:18px 6px}
.note{font-size:14px;background:#eef8fb;border-radius:12px;padding:10px;color:var(--deep);margin-top:10px}
.note.warn{background:#fff7e8;color:#7a4a00}
.hide{display:none!important}
.done-box{text-align:center;padding:10px 0}
.done-box .big{font-size:48px}
.tbl-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.tbl-row input,.tbl-row select{padding:8px}
.x{border:0;background:#fbe3e3;color:var(--bad);border-radius:10px;width:34px;height:34px;cursor:pointer;flex:0 0 34px;font-size:18px}
.hero{display:flex;gap:12px;align-items:center}
.intro h2{font-size:22px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tile{background:var(--foam);border-radius:14px;padding:10px 6px;text-align:center;font-weight:700;font-size:14px}
.tile span{display:block;font-size:26px;line-height:1.2}
.facts{list-style:none;padding:0;margin:8px 0}.facts li{padding:4px 0;font-size:15px}.facts li b{color:var(--deep)}
.how{display:grid;gap:8px;margin-top:10px}
.how div{display:flex;gap:10px;align-items:center;font-size:15px}
.how i{font-style:normal;flex:0 0 28px;height:28px;border-radius:14px;background:var(--sun);color:var(--deep);font-weight:800;display:flex;align-items:center;justify-content:center}
.wa{background:#169b62;font-size:18px;padding:16px}
.step-note{background:#fff8e6;border:1.5px dashed #f1d38a;border-radius:14px;padding:12px;margin:12px 0;font-size:15px}
.hero .t{flex:1}
.hero h2{margin:0}
</style>
</head>
<body>
<header class="top">
  <span class="bub" style="width:18px;height:18px;left:12%;bottom:0;animation-delay:0s"></span>
  <span class="bub" style="width:10px;height:10px;left:28%;bottom:0;animation-delay:2.5s"></span>
  <span class="bub" style="width:24px;height:24px;left:70%;bottom:0;animation-delay:1.2s"></span>
  <span class="bub" style="width:12px;height:12px;left:85%;bottom:0;animation-delay:4s"></span>
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" style="border-radius:50%;background:#fff">

<main class="wrap">

</main>

<p class="foot" style="text-align:center;color:#8aa3ad;font-size:12px;margin:18px 0 8px">© Bubbles Swim Academy</p>
<nav class="tabsbar"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   1) Firebase project settings
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCHNQoDClk14wkAkri-Pr6VQXXQ8dm4nds",
  authDomain: "bubbles-swim.firebaseapp.com",
  projectId: "bubbles-swim",
  storageBucket: "bubbles-swim.firebasestorage.app",
  messagingSenderId: "249314881205",
  appId: "1:249314881205:web:fa48f6ef48d8ff17ed58fc"
};
/* ===================================================================== */

const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const DAYS = ["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"]; // 0 = Saturday
const DEFAULT_SETTINGS = {
  name:"Bubbles Swim Academy", location:"",
  ipa:"", payLink:"", phone:"01014713391", instagram:"",
  perCoach:1, sessionMinutes:60,
  about:"Swimming lessons for every age — from baby swimming to adults. Patient, small classes that build water confidence, safety and real technique at your own pace.",
  coaches:[{id:"c1",name:"Coach Ahmed",gender:"m"},{id:"c2",name:"Assistant Coach",gender:"f"}],
  pkgVersion:6,
  packages:[
    {id:"a8",type:"p1",label:"Private · 8 sessions",sessions:8,price:2500},
    {id:"bb8",type:"baby",label:"Baby swimming · 8 sessions · 30 min",sessions:8,price:2500,minutes:30},
    {id:"b8",type:"p2",label:"Private for 2 · 8 sessions",sessions:8,price:4400},
    {id:"g8",type:"group",label:"Small group · 8 sessions",sessions:8,price:1000},
    {id:"s2",type:"sib",count:2,label:"2 siblings · 8 sessions",sessions:8,price:3500},
    {id:"s3",type:"sib",count:3,label:"3 siblings · 8 sessions",sessions:8,price:4000},
    {id:"s4",type:"sib",count:4,label:"4 siblings · 8 sessions",sessions:8,price:5000}
  ]
};
const DEFAULT_SLOTS = [[0,"09:00"],[0,"10:00"],[0,"11:00"],[6,"09:00"],[6,"10:00"],[6,"11:00"],[1,"17:00"],[1,"18:00"],[3,"17:00"],[3,"18:00"]]
  .map(([d,t])=>({id:"s"+d+t.replace(":",""),day:d,time:t,active:true}));

const S = { payments:[], payId:null, payBk:null, settings:structuredClone(DEFAULT_SETTINGS), slots:[], holds:[], bookings:[], mine:{},
  mode:"loading", fs:null, F:null, auth:null, A:null, admin:null, tab:"book", adminFilter:"pending", schedCoach:"all",
  form:{step:1, child:{}, pkg:null, perWeek:2, slots:[], coachPref:"any", start:"", payer:"", ref:"", mode:"custom", pref:"", ptype:"p1", c2n:"", c2a:"", sibs:[]}, lastBooking:null };

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toLocaleString("en-US")+" EGP"}
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
const slotById=id=>S.slots.find(s=>s.id===id);
const coachById=id=>S.settings.coaches.find(c=>c.id===id);
function fmtTime(t){if(!t)return"";let [h,m]=t.split(":").map(Number);return `${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"}`}
function slotLabel(id){const s=slotById(id);return s?`${DAYS[s.day]} ${fmtTime(s.time)}`:"Removed slot"}
const isActive=x=>x.status==="pending"||x.status==="paid";
const TYPES={p1:{name:"Private — 1 swimmer",short:"Private",note:""},baby:{name:"Baby swimming",short:"Baby swimming",note:""},p2:{name:"Private — 2 swimmers",short:"Private for 2",note:" for 2 swimmers"},group:{name:"Small group — 3 swimmers",short:"Small group",note:" per swimmer"},sib:{name:"Siblings — together",short:"Siblings",note:" for all siblings"}};
const typeOfPkg=p=>(p&&TYPES[p.type])?p.type:"p1";
const isG=v=>typeof v==="string"&&v.startsWith("g:");
const cOf=v=>String(v||"").replace(/^g:/,"");
const slotCap=()=>S.settings.coaches.length;
function cStat(cid,sid,except){let pr=0,gr=0;for(const h of S.holds){if(!isActive(h)||h.id===except)continue;const v=(h.coachBySlot||{})[sid];if(v===undefined||cOf(v)!==cid)continue;isG(v)?gr++:pr++}return{pr,gr}}
function spotsFor(type,sid,except){ // how many more bookings of this type fit in a slot
  let empty=0,groupOpen=0,uP=0,uG=0;
  for(const c of S.settings.coaches){const st=cStat(c.id,sid,except);if(!st.pr&&!st.gr)empty++;else if(!st.pr&&st.gr<3)groupOpen+=3-st.gr}
  for(const h of S.holds){if(!isActive(h)||h.id===except||!(h.slots||[]).includes(sid))continue;const v=(h.coachBySlot||{})[sid];if(v===undefined||cOf(v)==="")isG(v)?uG++:uP++}
  if(type==="group")return Math.max(0,groupOpen+Math.max(0,empty-uP)*3-uG);
  return Math.max(0,empty-uP-Math.ceil(Math.max(0,uG-groupOpen)/3));
}
function groupFill(sid){let best=0;for(const c of S.settings.coaches){const st=cStat(c.id,sid);if(!st.pr&&st.gr>best)best=st.gr}return best}
const slotUse=sid=>S.holds.filter(h=>isActive(h)&&(h.slots||[]).includes(sid)).length;
const coachFree=(cid,sid,type,except)=>{const st=cStat(cid,sid,except);return type==="group"?(!st.pr&&st.gr<3):(!st.pr&&!st.gr)};
const pkgOf=id=>S.settings.packages.find(p=>p.id===id)||S.settings.packages[0];
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmtDate(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function sessionDates(b){
  if(!b.start)return[];
  const days=(b.slots||[]).map(slotById).filter(Boolean).map(s=>({js:(s.day+6)%7,id:s.id}));
  if(!days.length)return[];
  const out=[],d=new Date(b.start+"T12:00:00");let g=0;
  while(out.length<b.sessions&&g<500){for(const h of days.filter(x=>x.js===d.getDay()))if(out.length<b.sessions)out.push({date:new Date(d),slot:h.id});d.setDate(d.getDate()+1);g++}
  return out;
}
function autoAssign(slots,pref,type,except){const o={},g=type==="group";for(const s of slots){
  const c=[...S.settings.coaches].sort((a,b)=>(b.id===pref)-(a.id===pref)||(g?(cStat(b.id,s,except).gr-cStat(a.id,s,except).gr):0)).find(c=>coachFree(c.id,s,type,except));
  o[s]=(g?"g:":"")+(c?c.id:"")}return o}
function myIds(){try{return JSON.parse(localStorage.getItem("bubbles_my")||"[]")}catch(e){return[]}}
function saveMyId(id){try{const a=myIds();a.unshift(id);localStorage.setItem("bubbles_my",JSON.stringify(a.slice(0,30)))}catch(e){}}
function waNum(p){return "2"+String(p||"").replace(/\D/g,"")}

/* ---------- data layer ---------- */
const configured=!String(firebaseConfig.apiKey).startsWith("PASTE");
async function init(){
  if(!configured){startDemo();return}
  try{
    const [{initializeApp},F,A]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-firestore.js"),import(FB+"firebase-auth.js")]);
    const app=initializeApp(firebaseConfig);S.F=F;S.A=A;S.fs=F.getFirestore(app);S.auth=A.getAuth(app);S.mode="live";
    const slow=setTimeout(()=>{if(!S._loaded)toast("Slow connection… loading data")},10000);
    F.onSnapshot(F.doc(S.fs,"settings","main"),s=>{S._loaded=true;clearTimeout(slow);if(s.exists()){const d={...s.data()};if(!(d.pkgVersion>=6))delete d.packages;S.settings={...structuredClone(DEFAULT_SETTINGS),...d}}render()},e=>console.warn(e));
    F.onSnapshot(F.collection(S.fs,"slots"),q=>{S.slots=q.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(e));
    F.onSnapshot(F.collection(S.fs,"holds"),q=>{S.holds=q.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(e));
    for(const id of myIds())watchMine(id);
    openPay();
    A.onAuthStateChanged(S.auth,u=>{S.admin=u||null;
      if(S._unBk){S._unBk();S._unBk=null}
      if(u){S._unBk=F.onSnapshot(F.collection(S.fs,"bookings"),q=>{const all=q.docs.map(d=>({id:d.id,...d.data()}));S.bookings=all.filter(x=>x.kind!=="payment");S.payments=all.filter(x=>x.kind==="payment");render()},e=>{toast("This account is not an admin");});
        if(S.tab==="login")S.tab="admin"}
      else{S.bookings=[];if(["admin","sched","settings"].includes(S.tab))S.tab="login"}
      render()});
  }catch(e){console.error(e);startDemo();toast("Can't reach the database")}
  render();
}
function watchMine(id){S.F.onSnapshot(S.F.doc(S.fs,"bookings",id),s=>{if(s.exists()){S.mine[id]={id,...s.data()};render()}},()=>{})}
function startDemo(){S.mode="demo";S.slots=structuredClone(DEFAULT_SLOTS);S.admin={email:"demo"};render();openPay()}

async function createBooking(b){
  const hold={slots:b.slots,status:"pending",coachBySlot:b.coachBySlot};
  if(S.mode==="demo"){const id=rid();S.bookings.push({id,...b});S.holds.push({id,...hold});S.mine[id]={id,...b};return id}
  const F=S.F,ref=F.doc(F.collection(S.fs,"bookings")),batch=F.writeBatch(S.fs);
  batch.set(ref,b);batch.set(F.doc(S.fs,"holds",ref.id),hold);await batch.commit();
  saveMyId(ref.id);watchMine(ref.id);return ref.id;
}
async function updateBooking(id,upd){ // keeps the public "hold" in step with the private booking
  const holdUpd={};if("status" in upd)holdUpd.status=upd.status;if("coachBySlot" in upd)holdUpd.coachBySlot=upd.coachBySlot;if("slots" in upd)holdUpd.slots=upd.slots;
  if(S.mode==="demo"){const b=S.bookings.find(x=>x.id===id);Object.assign(b,upd);const h=S.holds.find(x=>x.id===id);if(h)Object.assign(h,holdUpd);if(S.mine[id])Object.assign(S.mine[id],upd);render();return}
  const F=S.F,batch=F.writeBatch(S.fs);batch.update(F.doc(S.fs,"bookings",id),upd);if(Object.keys(holdUpd).length)batch.update(F.doc(S.fs,"holds",id),holdUpd);await batch.commit();
}
async function deleteBooking(id){

function readStep1(){const g=id=>$(id)?.value.trim()||"";S.form.child={childName:g("f-child"),age:g("f-age"),gender:g("f-gender"),level:g("f-level"),parentName:g("f-parent"),phone:g("f-phone").replace(/\s/g,""),notes:g("f-notes")}}

    <div class="card"><h2>Coaches</h2><div id="st-coaches">${st.coaches.map(c=>`<div class="tbl-row" data-c="${c.id}"><input value="${esc(c.name)}" data-k="name"><select data-k="gender" style="flex:0 0 95px"><option value="m" ${c.gender==="m"?"selected":""}>Coach (m)</option><option value="f" ${c.gender==="f"?"selected":""}>Coach (f)</option></select><button class="x" data-rmc="${c.id}">×</button></div>`).join("")}</div>
      <button class="btn sm ghost" data-act="addCoach">+ Coach</button></div>
    <div class="card"><h2>Packages & prices</h2><p class="muted">Type • name • sessions • price (EGP). “Private for 2” = total for both; “Small group” = per swimmer. “Siblings” = total for all, # = number of siblings.</p><div id="st-pkgs">${st.packages.map(p=>`<div class="tbl-row" data-p="${p.id}" style="flex-wrap:wrap"><select data-k="type" style="flex:1 1 100%">${Object.keys(TYPES).map(k=>`<option value="${k}" ${typeOfPkg(p)===k?"selected":""}>${TYPES[k].name}</option>`).join("")}</select><input value="${esc(p.label)}" data-k="label"><input type="number" min="2" max="8" style="flex:0 0 56px" value="${esc(p.count||"")}" data-k="count" title="Siblings count (siblings packages only)" placeholder="#"><input type="number" style="flex:0 0 64px" value="${p.sessions}" data-k="sessions"><input type="number" style="flex:0 0 60px" value="${esc(p.minutes||"")}" data-k="minutes" title="Minutes per session (leave empty for the default)" placeholder="min"><input type="number" style="flex:0 0 88px" value="${p.price}" data-k="price"><button class="x" data-rmp="${p.id}">×</button></div>`).join("")}</div>
      <button class="btn sm ghost" data-act="addPkg">+ Package</button></div>
    <div class="actions"><button class="btn block" data-act="saveSettings">Save settings</button></div>
    <div class="card"><h2>Bookable slots</h2>
      ${slots.map(s=>`<div class="tbl-row"><span style="flex:1">${DAYS[s.day]} ${fmtTime(s.time)} <span class="muted">(${slotUse(s.id)} booked)</span></span><button class="btn sm ${s.active!==false?"ghost":""}" data-tog="${s.id}">${s.active!==false?"Open":"Closed"}</button><button class="x" data-rms="${s.id}">×</button></div>`).join("")||`<div class="empty">No slots yet. <button class="btn sm sun" data-act="seedSlots">Add starter slots</button></div>`}
      <h3>Add a slot</h3><div class="row"><select id="ns-day">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select><input id="ns-time" type="time" value="17:00"></div>
      <div class="actions"><button class="btn block ghost" data-act="addSlot">+ Add slot</button></div></div>
    <div class="note">Coach login link: the academy link with <b>#admin</b> at the end</div>`;
}
function readSettings(){const st=structuredClone(S.settings),v=id=>$(id).value.trim();
  Object.assign(st,{name:v("st-name"),location:v("st-loc"),phone:v("st-phone"),instagram:v("st-ig"),about:v("st-about"),ipa:v("st-ipa"),payLink:v("st-link"),sessionMinutes:+v("st-min")||45,perCoach:Math.max(1,+v("st-per")||1)});
  st.coaches=[...document.querySelectorAll("#st-coaches [data-c]")].map(r=>({id:r.dataset.c,name:r.querySelector("[data-k=name]").value.trim()||"Coach",gender:r.querySelector("[data-k=gender]").value}));
  st.packages=[...document.querySelectorAll("#st-pkgs [data-p]")].map(r=>({id:r.dataset.p,type:r.querySelector("[data-k=type]").value,count:Math.max(0,+r.querySelector("[data-k=count]").value||0),minutes:Math.max(0,+r.querySelector("[data-k=minutes]").value||0),label:r.querySelector("[data-k=label]").value.trim()||"Package",sessions:Math.max(1,+r.querySelector("[data-k=sessions]").value||1),price:Math.max(0,+r.querySelector("[data-k=price]").value||0)}));
  st.pkgVersion=6;return st}
function reSettings(){document.activeElement?.blur?.();renderSettings()}
$("v-settings").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const a=t.dataset.act;
  if(a==="addCoach"){S.settings=readSettings();S.settings.coaches.push({id:"c"+rid().slice(0,6),name:"",gender:"m"});return reSettings()}
  if(a==="addPkg"){S.settings=readSettings();S.settings.packages.push({id:"p"+rid().slice(0,6),type:"p1",label:"",sessions:4,price:0});return reSettings()}
  if(t.dataset.rmc){S.settings=readSettings();if(S.settings.coaches.length<=1)return toast("Keep at least one coach");S.settings.coaches=S.settings.coaches.filter(c=>c.id!==t.dataset.rmc);reSettings();return toast("Press “Save” to keep this")}
  if(t.dataset.rmp){S.settings=readSettings();if(S.settings.packages.length<=1)return toast("Keep at least one package");S.settings.packages=S.settings.packages.filter(p=>p.id!==t.dataset.rmp);reSettings();return toast("Press “Save” to keep this")}
  if(a==="saveSettings"){const st=readSettings();t.disabled=true;if(await safe(()=>saveSettings(st),"Saved ✔"))S.settings=st;t.disabled=false;return reSettings()}
  if(a==="seedSlots"){t.disabled=true;for(const s of DEFAULT_SLOTS)await safe(()=>saveSlot(s));toast("Added ✔ — edit as you like");return reSettings()}
  if(a==="addSlot"){const day=+$("ns-day").value,time=$("ns-time").value;if(!time)return;const id="s"+day+time.replace(":","");
    if(slotById(id))return toast("That slot already exists");await safe(()=>saveSlot({id,day,time,active:true}),"Added ✔");return reSettings()}
  if(t.dataset.tog){const s=slotById(t.dataset.tog);await safe(()=>saveSlot({...s,active:s.active===false}));return reSettings()}
  if(t.dataset.rms){if(slotUse(t.dataset.rms)>0)return toast("This slot has bookings — close it instead of deleting");await safe(()=>deleteSlot(t.dataset.rms));return reSettings()}
});

render();init();
</script>
</body>
</html>
